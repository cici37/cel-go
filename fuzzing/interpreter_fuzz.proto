syntax = "proto3";

package google.internal.api.expr.fuzzing.v1alpha1;

import "google/api/expr/v1alpha1/checked.proto";
import "google/api/expr/v1alpha1/value.proto";

option java_multiple_files = true;
option go_package = "cel.dev/cel-go/fuzzing";

message InterpreterFuzzable {
  google.api.expr.v1alpha1.CheckedExpr checked_expr = 1;

  map<string, google.api.expr.v1alpha1.Value> activation = 2;
}

